<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORIDE // Cheat Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ RESET & TOKENS ═══════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0b0f18;
  --bg2:     #111827;
  --bg3:     #1a2236;
  --border:  #1e2d45;
  --border2: #2a3f60;
  --text:    #c8d8f0;
  --text2:   #7a9cc0;
  --text3:   #4a6880;
  --accent:  #00d4ff;
  --accent2: #0088bb;
  --green:   #2dffaa;
  --yellow:  #ffd166;
  --red:     #ff4d6d;
  --glow:    0 0 14px rgba(0,212,255,.35);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ═══ LAYOUT ════════════════════════════════════════ */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ═══ HEADER ════════════════════════════════════════ */
#header {
  flex-shrink: 0;
  background: linear-gradient(180deg, #0d1422 0%, #0b0f18 100%);
  border-bottom: 1px solid var(--border2);
  padding: 12px 20px 0;
  z-index: 100;
}
.header-top {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px; flex-wrap: wrap;
}
.logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px; font-weight: 700;
  color: var(--accent); letter-spacing: 3px;
  text-shadow: var(--glow); white-space: nowrap;
}
.logo em { color: var(--text3); font-style: normal; font-weight: 400; font-size: 11px; letter-spacing: 1px; }

/* Search */
.search-wrap { position: relative; flex: 1; min-width: 160px; max-width: 400px; }
.search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
#searchInput {
  width: 100%;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; padding: 7px 10px 7px 30px;
  border-radius: 5px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,255,.12); }
#searchInput::placeholder { color: var(--text3); }

/* Header buttons */
.hdr-btns { display: flex; gap: 6px; margin-left: auto; align-items: center; }
.hbtn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  padding: 6px 12px; border-radius: 5px; border: 1px solid;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: all .15s; white-space: nowrap;
}
.hbtn-edit   { background: rgba(45,255,170,.08); color: var(--green);  border-color: rgba(45,255,170,.25); }
.hbtn-edit:hover, .hbtn-edit.on { background: rgba(45,255,170,.18); border-color: var(--green); box-shadow: 0 0 8px rgba(45,255,170,.2); }
.hbtn-export { background: rgba(255,209,102,.08); color: var(--yellow); border-color: rgba(255,209,102,.25); }
.hbtn-export:hover { background: rgba(255,209,102,.18); border-color: var(--yellow); }
.hbtn-json   { background: rgba(0,212,255,.08);  color: var(--accent); border-color: rgba(0,212,255,.25); }
.hbtn-save   { background: rgba(45,255,170,.08); color: var(--green);  border-color: rgba(45,255,170,.25); }
.hbtn-save:hover { background: rgba(45,255,170,.18); border-color: var(--green); box-shadow: 0 0 8px rgba(45,255,170,.2); }
.hbtn-save:disabled { opacity: .5; cursor: not-allowed; }
.hbtn-json:hover { background: rgba(0,212,255,.18); border-color: var(--accent); }

/* Edit mode banner */
#editBanner {
  display: none;
  background: rgba(45,255,170,.06);
  border-top: 1px solid rgba(45,255,170,.15);
  color: var(--green);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; text-align: center; padding: 3px; letter-spacing: .5px;
}

/* ═══ TABS BAR ══════════════════════════════════════ */
#tabsBar {
  display: flex; align-items: center; gap: 2px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 0;
}
#tabsBar::-webkit-scrollbar { display: none; }

.tab-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  padding: 7px 14px; border: none; border-radius: 5px 5px 0 0;
  background: transparent; color: var(--text3); cursor: pointer;
  white-space: nowrap; position: relative;
  transition: color .15s, background .15s;
  display: flex; align-items: center; gap: 6px;
  user-select: none;
}
.tab-btn:hover { color: var(--text2); background: rgba(255,255,255,.04); }
.tab-btn.active { color: var(--accent); background: var(--bg2); border-top: 2px solid var(--accent); }
.tab-btn.dragging { opacity: .4; }
.tab-btn.drag-over { background: rgba(0,212,255,.1); border-top: 2px solid var(--accent); }

.tab-close {
  display: none; width: 14px; height: 14px;
  background: rgba(255,77,109,.2); color: var(--red);
  border: none; border-radius: 50%;
  font-size: 9px; line-height: 14px; text-align: center;
  cursor: pointer; transition: background .15s;
}
.tab-close:hover { background: rgba(255,77,109,.5); }

.tab-add {
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
  padding: 6px 12px; border: 1px dashed var(--border2);
  border-radius: 5px 5px 0 0; background: transparent;
  color: var(--text3); cursor: pointer; display: none; transition: all .15s;
}
.tab-add:hover { color: var(--green); border-color: var(--green); }

/* Edit mode */
body.edit .tab-close  { display: inline-block; }
body.edit .tab-add    { display: inline-block; }
body.edit #editBanner { display: block; }
body.edit .edit-only  { display: flex !important; }
body:not(.edit) .edit-only  { display: none !important; }
body.edit .editable:hover { outline: 1px dashed rgba(45,255,170,.4); cursor: text; }

/* ═══ CONTENT ═══════════════════════════════════════ */
#content { flex: 1; overflow-y: auto; padding: 20px; }
#content::-webkit-scrollbar { width: 5px; }
#content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Section head */
.sec-head {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px; margin-bottom: 12px;
}
.sec-title-wrap { flex: 1; }
.sec-title {
  font-family: 'JetBrains Mono', monospace; font-size: 18px;
  font-weight: 700; color: var(--accent); text-shadow: var(--glow); letter-spacing: 1px;
}
.sec-sub  { font-size: 12px; color: var(--text3); margin-top: 3px; }
.sec-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ═══ TAG BAR ═══════════════════════════════════════ */
.tag-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tag-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 3px 9px; border-radius: 12px; cursor: pointer;
  background: rgba(0,212,255,.08); color: var(--accent);
  border: 1px solid rgba(0,212,255,.2); transition: all .12s;
}
.tag-pill:hover, .tag-pill.active {
  background: rgba(0,212,255,.2); border-color: var(--accent);
}
.tag-clear {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 3px 9px; border-radius: 12px; cursor: pointer;
  background: rgba(255,77,109,.08); color: var(--red);
  border: 1px solid rgba(255,77,109,.2); transition: all .12s;
}
.blk-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.blk-tag {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 7px; border-radius: 10px; cursor: pointer;
  background: rgba(45,255,170,.07); color: var(--green);
  border: 1px solid rgba(45,255,170,.15); transition: all .12s;
}
.blk-tag:hover { background: rgba(45,255,170,.18); }

/* ═══ BLOCKS ════════════════════════════════════════ */
.block { margin-top: 22px; }
.block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.block-label {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  color: var(--text2); letter-spacing: 2px; text-transform: uppercase;
  padding-left: 9px; border-left: 2px solid var(--accent2); flex: 1;
}
.block-actions { display: flex; gap: 4px; align-items: center; margin-left: auto; }

/* Block menu */
.blk-menu-wrap { position: relative; }
.blk-menu-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
  padding: 2px 8px; border: 1px solid var(--border2);
  background: transparent; color: var(--text2); border-radius: 4px; cursor: pointer;
  transition: all .12s; line-height: 1;
}
.blk-menu-btn:hover { background: var(--bg3); color: var(--accent); }
.blk-menu {
  display: none; position: absolute; right: 0; top: calc(100% + 4px);
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 7px; min-width: 170px; z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,.6); overflow: hidden;
}
.blk-menu.open { display: block; }
.blk-menu button {
  display: block; width: 100%; text-align: left;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 8px 14px; background: transparent; color: var(--text2);
  border: none; cursor: pointer; transition: background .1s;
  border-bottom: 1px solid var(--border);
}
.blk-menu button:last-child { border-bottom: none; }
.blk-menu button:hover { background: var(--bg3); color: var(--text); }
.blk-menu .edit-only-mi { display: none; }
body.edit .blk-menu .edit-only-mi { display: block; }
.blk-menu .danger-mi { color: var(--red) !important; }

/* ═══ TABLE ═════════════════════════════════════════ */
.tbl-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead tr { background: var(--bg3); }
thead th {
  padding: 9px 12px; text-align: left;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  color: var(--accent); letter-spacing: 1px;
  border-bottom: 1px solid var(--border2); white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(0,212,255,.03); }
tbody tr.hidden { display: none; }

td {
  padding: 8px 12px; vertical-align: top;
  color: var(--text); line-height: 1.55; position: relative;
}
td:first-child { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); }

/* Markdown cell */
.md-cell { min-width: 80px; }
.md-content { padding-right: 22px; }
.md-code {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; padding: 6px 10px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--green); overflow-x: auto; margin: 4px 0;
  white-space: pre; line-height: 1.5;
}
.md-inline {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 5px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--green);
}
.md-heading { color: var(--accent); display: block; margin-bottom: 3px; }
.md-li { display: block; padding-left: 6px; }
.md-content a { color: var(--accent); text-decoration: underline; }

/* Copy button */
.copy-btn {
  position: absolute; top: 6px; right: 4px;
  font-size: 11px; padding: 1px 5px;
  background: rgba(0,212,255,.06); color: var(--text3);
  border: 1px solid var(--border); border-radius: 3px; cursor: pointer;
  opacity: 0; transition: opacity .15s, color .15s;
}
td:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--accent); background: rgba(0,212,255,.14); }

/* Row actions */
td.row-act { width: 72px; padding: 4px 6px; }
.row-btns  { display: flex; gap: 3px; align-items: center; }
.rbtn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 5px; border: none; border-radius: 3px; cursor: pointer; transition: background .12s;
}
.rbtn-del { background: rgba(255,77,109,.15); color: var(--red); }
.rbtn-del:hover { background: rgba(255,77,109,.35); }
.rbtn-up, .rbtn-dn { background: rgba(0,212,255,.1); color: var(--accent); }
.rbtn-up:hover, .rbtn-dn:hover { background: rgba(0,212,255,.25); }

/* Add row button */
.add-row-btn {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  width: 100%; margin-top: 6px; padding: 6px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--green); background: rgba(45,255,170,.05);
  border: 1px dashed rgba(45,255,170,.25); border-radius: 5px; cursor: pointer; transition: all .15s;
}
.add-row-btn:hover { background: rgba(45,255,170,.12); border-color: var(--green); }

/* ═══ SMALL BUTTONS ═════════════════════════════════ */
.sbtn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  padding: 4px 9px; border-radius: 4px; border: 1px solid; cursor: pointer;
  display: flex; align-items: center; gap: 4px; transition: all .12s; white-space: nowrap;
}
.sbtn-add    { background: rgba(45,255,170,.08); color: var(--green);  border-color: rgba(45,255,170,.3); }
.sbtn-add:hover    { background: rgba(45,255,170,.2); }
.sbtn-del    { background: rgba(255,77,109,.08); color: var(--red);    border-color: rgba(255,77,109,.3); }
.sbtn-del:hover    { background: rgba(255,77,109,.2); }
.sbtn-import { background: rgba(0,212,255,.08);  color: var(--accent); border-color: rgba(0,212,255,.25); }
.sbtn-import:hover { background: rgba(0,212,255,.2); }
.sbtn { background: rgba(0,212,255,.06); color: var(--text2); border-color: var(--border2); }
.sbtn:hover { color: var(--accent); border-color: var(--accent2); }

/* ═══ SEARCH RESULTS ════════════════════════════════ */
.search-results-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 14px; border-bottom: 1px solid var(--border2); margin-bottom: 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent);
}
.search-result-group { margin-bottom: 22px; }
.search-result-meta {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 8px; flex-wrap: wrap;
}
.sr-tab   { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); }
.sr-arrow { color: var(--text3); }
.sr-block { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text2); }
.sr-goto  { margin-left: auto; font-size: 10px; padding: 3px 8px; }

/* ═══ EMPTY STATE ═══════════════════════════════════ */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace; font-size: 13px; gap: 12px; text-align: center;
}
.empty-state .big { font-size: 32px; }

/* Search highlight */
mark { background: rgba(255,209,102,.3); color: inherit; border-radius: 2px; }

/* ═══ MODAL ═════════════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
  z-index: 500; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 22px 24px 20px;
  width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,.7);
}
.modal h3 {
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
  color: var(--accent); letter-spacing: 1px; margin-bottom: 16px;
}
.modal label {
  display: block; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text2); margin-bottom: 4px;
}
.modal input:not([type=radio]):not([type=file]),
.modal textarea, .modal select {
  display: block; width: 100%;
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; padding: 8px 10px; border-radius: 5px; outline: none;
  margin-bottom: 12px; transition: border-color .15s;
}
.modal input[type=file] { display: block; margin-bottom: 12px; }
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--accent); }
.modal textarea { resize: vertical; min-height: 72px; line-height: 1.55; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.mbtn-ok {
  background: var(--accent2); color: #fff;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  padding: 7px 18px; border: none; border-radius: 5px; cursor: pointer; transition: background .15s;
}
.mbtn-ok:hover { background: var(--accent); }
.mbtn-cancel {
  background: transparent; color: var(--text3);
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 7px 14px; border: 1px solid var(--border2); border-radius: 5px; cursor: pointer; transition: all .15s;
}
.mbtn-cancel:hover { border-color: var(--text2); color: var(--text); }

/* ═══ TOAST ═════════════════════════════════════════ */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--bg3); border: 1px solid var(--border2); color: var(--green);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 9px 16px; border-radius: 6px;
  opacity: 0; transform: translateY(12px); transition: all .25s; pointer-events: none; z-index: 999;
}
#toast.show { opacity: 1; transform: translateY(0); }

/* ═══ RESPONSIVE ════════════════════════════════════ */
@media (max-width: 600px) {
  #header { padding: 10px 12px 0; }
  #content { padding: 14px 12px; }
  .hbtn em, .logo em { display: none; }
  .sec-title { font-size: 15px; }
}
</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div class="header-top">
      <div class="logo">TORIDE <em>// CHEAT SHEET</em></div>

      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="全タブ横断検索… (Ctrl+K)" autocomplete="off">
      </div>

      <div class="hdr-btns">
        <button class="hbtn hbtn-edit"   id="editBtn"  onclick="toggleEdit()">✏️ <em>編集</em></button>
        <button class="hbtn hbtn-save"   id="saveBtn" onclick="saveToGitHub()">💾 <em>保存</em></button>
        <button class="hbtn hbtn-json"   onclick="exportJSON()">🗄 <em>JSON出力</em></button>
        <!-- <button class="hbtn hbtn-export" onclick="exportHTML()">📥 <em>書き出し</em></button>  -->
      </div>
    </div>

    <!-- Tab bar -->
    <div id="tabsBar">
      <button class="tab-add" onclick="addTab()" title="タブを追加">＋</button>
    </div>

    <div id="editBanner">✏️ EDIT MODE — クリックで編集 / ＋ で追加 / × で削除 / タブをドラッグで並び替え</div>
  </div>

  <!-- CONTENT -->
  <div id="content"></div>

</div><!-- #app -->

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-btns">
      <button class="mbtn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="mbtn-ok"     onclick="confirmModal()">OK</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
