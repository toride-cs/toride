<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>go2 cheatsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   Material Design 3 — Design Tokens
════════════════════════════════════════════════════ */
:root {
  /* ── Light theme (default) ── */
  --md-primary:        #0b57d0;
  --md-on-primary:     #ffffff;
  --md-primary-container:#d3e3fd;
  --md-on-primary-container:#041e49;
  --md-secondary-container:#e8eef9;

  --md-surface:        #ffffff;
  --md-surface-dim:    #f6f8fc;
  --md-surface-1:      #f7f9fd;
  --md-surface-2:      #eef3fb;
  --md-surface-3:      #e6eef9;
  --md-surface-container:#f0f4f9;

  --md-on-surface:     #1f1f1f;
  --md-on-surface-var: #444746;
  --md-outline:        #c4c7c5;
  --md-outline-var:    #e1e3e1;

  --md-error:          #b3261e;
  --md-success:        #146c2e;
  --md-warn:           #9a6700;

  --code-bg:           #f6f8fa;
  --code-fg:           #0b3d91;
  --code-block-bg:     #1b1f23;
  --code-block-fg:     #e6edf3;
  --mark:              #fff3a3;

  --shadow-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.10);
  --shadow-2: 0 1px 3px rgba(0,0,0,.08), 0 4px 8px rgba(0,0,0,.10);
  --shadow-3: 0 4px 12px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.12);

  --radius-sm: 8px;
  --radius:    12px;
  --radius-lg: 16px;
  --radius-xl: 28px;
  --radius-full: 999px;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  --font-sans: 'Inter','Noto Sans JP',system-ui,-apple-system,sans-serif;
  --font-mono: 'JetBrains Mono',ui-monospace,monospace;

  --header-h: 104px;
  --ease: cubic-bezier(.2,0,0,1);
  --ease-emph: cubic-bezier(.3,0,0,1);
}

[data-theme="dark"] {
  --md-primary:        #a8c7fa;
  --md-on-primary:     #062e6f;
  --md-primary-container:#0842a0;
  --md-on-primary-container:#d3e3fd;
  --md-secondary-container:#283040;

  --md-surface:        #131314;
  --md-surface-dim:    #131314;
  --md-surface-1:      #1b1b1c;
  --md-surface-2:      #202124;
  --md-surface-3:      #28292c;
  --md-surface-container:#1e1f22;

  --md-on-surface:     #e3e3e3;
  --md-on-surface-var: #c4c7c5;
  --md-outline:        #444746;
  --md-outline-var:    #303134;

  --code-bg:           #282a2e;
  --code-fg:           #a8c7fa;
  --code-block-bg:     #0d1117;
  --code-block-fg:     #e6edf3;
  --mark:              #5c5000;

  --shadow-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
  --shadow-2: 0 1px 3px rgba(0,0,0,.4), 0 4px 8px rgba(0,0,0,.5);
  --shadow-3: 0 4px 12px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--md-surface-dim);
  color: var(--md-on-surface);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.material-symbols-rounded {
  font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  user-select: none; font-size: 20px; line-height: 1;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::selection { background: var(--md-primary-container); color: var(--md-on-primary-container); }

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--md-outline) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: 99px; }
*::-webkit-scrollbar-track { background: transparent; }

/* ═══════════════════════════════════════════════════
   Header (Google-style search bar)
════════════════════════════════════════════════════ */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--md-surface);
  border-bottom: 1px solid var(--md-outline-var);
  transition: box-shadow .2s;
}
.app-header.scrolled { box-shadow: var(--shadow-1); }
.header-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-2) var(--sp-5); min-height: 54px;
}
/* 下段: モードスイッチ行（横スクロール可・折り返さない） */
.mode-row {
  max-width: 1400px; margin: 0 auto;
  padding: 0 var(--sp-5) var(--sp-2);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin;
}
.mode-row::-webkit-scrollbar { height: 6px; }
.mode-row::-webkit-scrollbar-thumb { background: var(--md-outline-var); border-radius: 3px; }
.brand {
  display: flex; align-items: center; gap: var(--sp-3);
  font-weight: 700; font-size: 20px; letter-spacing: -.3px;
  white-space: nowrap; flex-shrink: 0;
}
.brand-mark {
  width: 40px; height: 36px; flex-shrink: 0;
  color: var(--md-on-surface);   /* 六角形左側と>_ がテーマに追従 */
}
.brand-lockup { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
.brand-text { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
.brand-go2 { color: #1a7dff; }
.brand-cs { color: var(--md-on-surface); }   /* 黒文字部分＝テーマ追従 */
.brand-sub {
  font-family: var(--font-mono); font-size: 8.5px; font-weight: 600;
  letter-spacing: .8px; color: var(--md-on-surface-var);
}
@media (max-width: 720px){ .brand-lockup{ display:none; } }

/* Search */
.search-wrap { flex: 1; max-width: 720px; position: relative; }
.search-box {
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--md-surface-container);
  border: 1px solid transparent;
  border-radius: var(--radius-full);
  padding: 0 var(--sp-5); height: 48px;
  transition: background .2s, box-shadow .2s, border-color .2s;
}
.search-box:hover { background: var(--md-surface); box-shadow: var(--shadow-1); }
.search-box:focus-within {
  background: var(--md-surface);
  box-shadow: var(--shadow-2);
  border-color: var(--md-outline-var);
}
.search-box .lead-icon { color: var(--md-on-surface-var); }
.search-box input {
  flex: 1; border: none; background: none; outline: none;
  font-size: 16px; color: var(--md-on-surface);
  font-family: var(--font-sans);
}
.search-box input::placeholder { color: var(--md-on-surface-var); }
.search-clear {
  display: none; width: 32px; height: 32px; border-radius: 50%;
  place-items: center; color: var(--md-on-surface-var);
  transition: background .15s;
}
.search-clear:hover { background: var(--md-surface-2); }
.search-clear.show { display: grid; }
.kbd-hint {
  display: flex; align-items: center; gap: 3px;
  font-size: 11px; color: var(--md-on-surface-var);
  border: 1px solid var(--md-outline-var); border-radius: 6px;
  padding: 2px 6px; font-family: var(--font-mono);
}
@media (max-width: 560px){ .kbd-hint{ display:none; } }

.header-actions { display: flex; align-items: center; gap: var(--sp-1); flex-shrink: 0; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--md-on-surface-var);
  transition: background .15s, color .15s;
  position: relative;
}
.icon-btn:hover { background: var(--md-surface-2); color: var(--md-on-surface); }
.icon-btn.active { color: var(--md-primary); background: var(--md-primary-container); }

/* ═══════════════════════════════════════════════════
   Layout
════════════════════════════════════════════════════ */
.layout { max-width: 1400px; margin: 0 auto; display: flex; min-height: calc(100vh - var(--header-h)); }

/* Sidebar (categories) */
.sidebar {
  width: 260px; flex-shrink: 0; padding: var(--sp-5) var(--sp-3);
  border-right: 1px solid var(--md-outline-var);
  position: sticky; top: var(--header-h); align-self: flex-start;
  height: calc(100vh - var(--header-h)); overflow-y: auto;
}
.side-section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .8px;
  text-transform: uppercase; color: var(--md-on-surface-var);
  padding: var(--sp-3) var(--sp-4) var(--sp-2);
}
.nav-item {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; text-align: left;
  padding: 0 var(--sp-4); height: 48px;
  border-radius: var(--radius-full);
  color: var(--md-on-surface-var); font-size: 14px; font-weight: 500;
  transition: background .15s, color .15s;
  position: relative;
}
.nav-item:hover { background: var(--md-surface-2); }
.nav-item.active { background: var(--md-secondary-container); color: var(--md-on-surface); font-weight: 600; }
.nav-item .nav-icon { font-size: 20px; flex-shrink: 0; }
.nav-item .nav-emoji { font-size: 18px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-item .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .nav-count {
  font-size: 12px; font-weight: 600; color: var(--md-on-surface-var);
  background: var(--md-surface-3); border-radius: 99px;
  padding: 1px 9px; min-width: 24px; text-align: center;
}
.nav-item.active .nav-count { background: var(--md-surface); }

.sidebar-scrim { display: none; }

/* Main */
.main { flex: 1; min-width: 0; padding: var(--sp-6) var(--sp-8); }
@media (max-width: 900px){ .main{ padding: var(--sp-5) var(--sp-4); } }

/* Breadcrumb / page head */
.page-head { margin-bottom: var(--sp-6); }
.breadcrumb {
  display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;
  font-size: 13px; color: var(--md-on-surface-var); margin-bottom: var(--sp-2);
}
.breadcrumb button { color: var(--md-primary); font-weight: 500; font-size: 13px; }
.breadcrumb button:hover { text-decoration: underline; }
.breadcrumb .material-symbols-rounded { font-size: 16px; }
.page-title { font-size: 28px; font-weight: 700; letter-spacing: -.5px; display: flex; align-items: center; gap: var(--sp-3); }
.page-sub { color: var(--md-on-surface-var); font-size: 14px; margin-top: var(--sp-1); }

/* Filter chips */
.chip-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin: var(--sp-5) 0; }
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  height: 34px; padding: 0 var(--sp-4);
  border: 1px solid var(--md-outline); border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; color: var(--md-on-surface-var);
  background: var(--md-surface); transition: all .15s;
}
.chip:hover { background: var(--md-surface-2); }
.chip.active {
  background: var(--md-secondary-container); color: var(--md-on-surface);
  border-color: transparent; font-weight: 600;
}
.chip.active .material-symbols-rounded { color: var(--md-primary); }
.chip .material-symbols-rounded { font-size: 18px; }

/* ═══════════════════════════════════════════════════
   Category cards (home)
════════════════════════════════════════════════════ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--sp-4);
}
.cat-card, .sheet-card {
  background: var(--md-surface);
  border: 1px solid var(--md-outline-var);
  border-radius: var(--radius-lg);
  padding: var(--sp-5);
  transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s;
  text-align: left; display: flex; flex-direction: column; gap: var(--sp-3);
  position: relative; overflow: hidden;
}
.cat-card:hover, .sheet-card:hover {
  box-shadow: var(--shadow-2); transform: translateY(-2px);
  border-color: transparent;
}
.cat-card:active, .sheet-card:active { transform: translateY(0); }
.cat-card-head { display: flex; align-items: center; gap: var(--sp-3); }
.cat-badge {
  width: 48px; height: 48px; border-radius: var(--radius);
  display: grid; place-items: center; font-size: 24px;
  background: var(--md-primary-container); color: var(--md-on-primary-container);
  flex-shrink: 0;
}
.cat-card-title { font-size: 18px; font-weight: 700; }
.cat-card-desc { font-size: 13px; color: var(--md-on-surface-var); }
.cat-card-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: var(--sp-2);
  font-size: 12px; color: var(--md-on-surface-var);
}
.cat-card-foot .arrow { color: var(--md-primary); transition: transform .2s; }
.cat-card:hover .cat-card-foot .arrow { transform: translateX(4px); }

/* Sheet cards */
.sheet-card-head { display: flex; align-items: flex-start; gap: var(--sp-3); }
.sheet-emoji { font-size: 24px; line-height: 1.2; flex-shrink: 0; }
.sheet-card-title { font-size: 16px; font-weight: 600; }
.sheet-card-meta { font-size: 12px; color: var(--md-on-surface-var); margin-top: 2px; }
.sheet-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.mini-tag {
  font-size: 11px; font-weight: 500; color: var(--md-on-surface-var);
  background: var(--md-surface-2); border-radius: var(--radius-full);
  padding: 2px 10px;
}

/* ═══════════════════════════════════════════════════
   Blocks / tables (content view)
════════════════════════════════════════════════════ */
.section-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-4); }
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  height: 40px; padding: 0 var(--sp-4);
  border-radius: var(--radius-full); font-size: 14px; font-weight: 500;
  transition: all .15s; border: 1px solid transparent;
}
.btn .material-symbols-rounded { font-size: 18px; }
.btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
.btn-filled:hover { box-shadow: var(--shadow-2); filter: brightness(1.05); }
.btn-tonal { background: var(--md-secondary-container); color: var(--md-on-surface); }
.btn-tonal:hover { box-shadow: var(--shadow-1); }
.btn-outlined { border-color: var(--md-outline); color: var(--md-primary); background: var(--md-surface); }
.btn-outlined:hover { background: var(--md-surface-2); }
.btn-text { color: var(--md-primary); padding: 0 var(--sp-3); }
.btn-text:hover { background: var(--md-surface-2); }
.btn-danger { color: var(--md-error); }

.block {
  background: var(--md-surface);
  border: 1px solid var(--md-outline-var);
  border-radius: var(--radius-lg);
  margin-bottom: var(--sp-5); overflow: hidden;
  transition: box-shadow .2s;
}
.block:hover { box-shadow: var(--shadow-1); }
.block-head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--md-outline-var);
}
.block-label { font-size: 16px; font-weight: 600; flex: 1; }
.blk-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.blk-tag {
  font-size: 11px; font-weight: 500; color: var(--md-primary);
  background: var(--md-primary-container); border-radius: var(--radius-full);
  padding: 2px 10px; transition: filter .15s;
}
.blk-tag:hover { filter: brightness(.95); }

.block-actions { position: relative; }
.blk-menu-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; color: var(--md-on-surface-var);
  transition: background .15s;
}
.blk-menu-btn:hover { background: var(--md-surface-2); }
.blk-menu {
  display: none; position: absolute; right: 0; top: 42px; z-index: 30;
  background: var(--md-surface); border: 1px solid var(--md-outline-var);
  border-radius: var(--radius); box-shadow: var(--shadow-3);
  min-width: 180px; padding: var(--sp-2); overflow: hidden;
}
.blk-menu.open { display: block; animation: menuIn .15s var(--ease); }
@keyframes menuIn { from{ opacity:0; transform: translateY(-4px) scale(.98);} to{ opacity:1; transform:none;} }
.blk-menu button {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%;
  padding: var(--sp-3) var(--sp-3); border-radius: var(--radius-sm);
  font-size: 14px; color: var(--md-on-surface); text-align: left;
  transition: background .12s;
}
.blk-menu button:hover { background: var(--md-surface-2); }
.blk-menu button .material-symbols-rounded { font-size: 18px; color: var(--md-on-surface-var); }
.blk-menu button.danger-mi { color: var(--md-error); }
.blk-menu button.danger-mi .material-symbols-rounded { color: var(--md-error); }
.blk-menu .edit-only-mi { display: none; }
body.edit .blk-menu .edit-only-mi { display: flex; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  text-align: left; font-weight: 600; font-size: 12px;
  letter-spacing: .3px; text-transform: uppercase;
  color: var(--md-on-surface-var);
  padding: var(--sp-3) var(--sp-4);
  background: var(--md-surface-1);
  border-bottom: 1px solid var(--md-outline-var);
  position: sticky; top: 0;
}
tbody td {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--md-outline-var);
  vertical-align: top; position: relative;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--md-surface-1); }
.md-cell { padding-right: 44px; }
.md-content { word-break: break-word; }
/* 折り返さない列: 縦書き化を防ぎ、はみ出したら横スクロール */
td.nowrap-col .md-content { white-space: nowrap; overflow-x: auto; max-width: 100%; }
td.nowrap-col .md-content::-webkit-scrollbar { height: 6px; }
th.nowrap-col { white-space: nowrap; }
.md-content a { color: var(--md-primary); text-decoration: none; }
.md-content a:hover { text-decoration: underline; }
.md-heading { display: block; font-size: 14px; margin: 2px 0; }
.md-li { display: block; padding-left: 4px; }

.md-inline {
  font-family: var(--font-mono); font-size: 13px;
  background: var(--code-bg); color: var(--code-fg);
  padding: 2px 6px; border-radius: 6px;
}
.md-code {
  font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
  background: var(--code-block-bg); color: var(--code-block-fg);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-sm);
  overflow-x: auto; white-space: pre; margin: 4px 0;
}

.copy-btn {
  position: absolute; top: 6px; right: 6px;
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: grid; place-items: center; opacity: 0;
  color: var(--md-on-surface-var); background: var(--md-surface);
  border: 1px solid var(--md-outline-var);
  transition: opacity .15s, background .15s, color .15s;
  cursor: pointer; z-index: 2;
}
.copy-btn .material-symbols-rounded { font-size: 18px; }
/* 行にカーソルが乗ったら、その行の全セルのコピーボタンをうっすら表示 */
tbody tr:hover .copy-btn { opacity: .5; }
/* セル個別にホバーしたら、そのボタンをはっきり表示 */
td:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: var(--md-primary-container); color: var(--md-on-primary-container); opacity: 1; }
.copy-btn.copied { color: var(--md-success); opacity: 1; }
/* タッチ端末では常時表示（ホバーが無いため） */
@media (hover: none) {
  .copy-btn { opacity: .55; }
}

.add-row-btn {
  display: none; align-items: center; gap: var(--sp-2);
  width: 100%; justify-content: center; padding: var(--sp-3);
  color: var(--md-primary); font-size: 14px; font-weight: 500;
  border-top: 1px solid var(--md-outline-var);
}
body.edit .add-row-btn { display: flex; }
.add-row-btn:hover { background: var(--md-surface-1); }

.row-act { width: 0; padding: 0 !important; }
.row-btns { display: none; gap: 2px; }
body.edit .row-btns { display: flex; }
.rbtn {
  width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center;
  color: var(--md-on-surface-var); transition: background .12s;
}
.rbtn:hover { background: var(--md-surface-2); }
.rbtn-del:hover { background: #fde8e6; color: var(--md-error); }
[data-theme="dark"] .rbtn-del:hover { background: #3b1a17; }

.edit-only { display: none; }
body.edit .edit-only { display: flex; }
body.edit .editable:hover { outline: 2px dashed var(--md-primary); outline-offset: 2px; border-radius: 4px; cursor: text; }

/* ═══════════════════════════════════════════════════
   Search results
════════════════════════════════════════════════════ */
.search-scope-bar {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  margin-bottom: var(--sp-5); padding: var(--sp-3) var(--sp-4);
  background: var(--md-surface-1); border-radius: var(--radius);
  font-size: 14px; color: var(--md-on-surface-var);
}
.search-stat { font-weight: 600; color: var(--md-on-surface); }
.result-group {
  background: var(--md-surface); border: 1px solid var(--md-outline-var);
  border-radius: var(--radius-lg); margin-bottom: var(--sp-4); overflow: hidden;
}
.result-meta {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); background: var(--md-surface-1);
  border-bottom: 1px solid var(--md-outline-var); font-size: 13px;
}
.result-meta .rm-cat {
  font-size: 11px; font-weight: 600; color: var(--md-primary);
  background: var(--md-primary-container); border-radius: 99px; padding: 2px 10px;
}
.result-meta .rm-tab { font-weight: 600; }
.result-meta .rm-block { color: var(--md-on-surface-var); }
.result-meta .material-symbols-rounded { font-size: 16px; color: var(--md-on-surface-var); }
.result-goto { margin-left: auto; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }

/* Empty state */
.empty-state {
  display: grid; place-items: center; text-align: center;
  padding: var(--sp-10) var(--sp-4); gap: var(--sp-3); color: var(--md-on-surface-var);
}
.empty-state .empty-icon {
  width: 80px; height: 80px; border-radius: 50%;
  display: grid; place-items: center; background: var(--md-surface-2);
  margin-bottom: var(--sp-2);
}
.empty-state .empty-icon .material-symbols-rounded { font-size: 40px; color: var(--md-on-surface-var); }
.empty-state h3 { font-size: 18px; font-weight: 600; color: var(--md-on-surface); }
.empty-state p { font-size: 14px; max-width: 380px; }

/* ═══════════════════════════════════════════════════
   FAB (edit mode toggle on mobile) & edit banner
════════════════════════════════════════════════════ */
#editBanner {
  display: none; align-items: center; gap: var(--sp-2);
  background: var(--md-primary-container); color: var(--md-on-primary-container);
  padding: var(--sp-2) var(--sp-4); font-size: 13px; font-weight: 500;
  border-radius: var(--radius-full); margin-bottom: var(--sp-4);
}
body.edit #editBanner { display: flex; }
#editBanner .material-symbols-rounded { font-size: 18px; }

/* ═══════════════════════════════════════════════════
   Modal
════════════════════════════════════════════════════ */
.modal-scrim {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.4); backdrop-filter: blur(2px);
  align-items: center; justify-content: center; padding: var(--sp-4);
}
.modal-scrim.open { display: flex; animation: fadeIn .2s; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.modal {
  background: var(--md-surface); border-radius: var(--radius-xl);
  box-shadow: var(--shadow-3); width: 100%; max-width: 520px;
  max-height: 85vh; overflow-y: auto; padding: var(--sp-6);
  animation: modalIn .25s var(--ease-emph);
}
@keyframes modalIn { from{opacity:0; transform: scale(.95) translateY(10px);} to{opacity:1; transform:none;} }
.modal-title { font-size: 22px; font-weight: 600; margin-bottom: var(--sp-5); }
.modal-body label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--md-on-surface-var); margin: var(--sp-4) 0 var(--sp-2);
}
.modal-body label:first-child { margin-top: 0; }
.modal-body input, .modal-body textarea, .modal-body select {
  width: 100%; padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--md-outline); border-radius: var(--radius-sm);
  background: var(--md-surface); color: var(--md-on-surface);
  font-size: 15px; font-family: var(--font-sans); transition: border-color .15s, box-shadow .15s;
}
.modal-body textarea { min-height: 130px; font-family: var(--font-mono); font-size: 13px; resize: vertical; }
.modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus {
  outline: none; border-color: var(--md-primary);
  box-shadow: 0 0 0 3px var(--md-primary-container);
}
.modal-hint { font-size: 11px; color: var(--md-on-surface-var); margin-top: var(--sp-2); font-family: var(--font-mono); }
.modal-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-6); }
.modal-radio { display: flex; flex-direction: column; gap: var(--sp-2); }
.modal-radio label {
  display: flex; align-items: center; gap: var(--sp-3); margin: 0;
  padding: var(--sp-3) var(--sp-4); border: 1px solid var(--md-outline-var);
  border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; color: var(--md-on-surface);
  font-weight: 400; transition: background .12s;
}
.modal-radio label:hover { background: var(--md-surface-1); }
.modal-radio input { width: auto; }

/* column-wrap settings */
.wrap-list { display: flex; flex-direction: column; gap: var(--sp-2); }
.wrap-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-3) var(--sp-4); margin: 0;
  border: 1px solid var(--md-outline-var); border-radius: var(--radius-sm);
  font-size: 14px; color: var(--md-on-surface); font-weight: 500; cursor: pointer;
}
.wrap-toggle:hover { background: var(--md-surface-1); }
.wrap-col-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap-switch { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
.wrap-switch input { width: 18px; height: 18px; accent-color: var(--md-primary); }
.wrap-switch-label { font-size: 12px; color: var(--md-on-surface-var); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--md-on-surface); color: var(--md-surface);
  padding: var(--sp-3) var(--sp-5); border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 500; z-index: 300; box-shadow: var(--shadow-3);
  opacity: 0; transition: transform .3s var(--ease-emph), opacity .3s; pointer-events: none;
  max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ═══════════════════════════════════════════════════
   Responsive
════════════════════════════════════════════════════ */
.menu-toggle { display: none; }
@media (max-width: 900px) {
  .menu-toggle { display: grid; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 150;
    width: 280px; height: 100vh; background: var(--md-surface);
    transform: translateX(-100%); transition: transform .3s var(--ease-emph);
    box-shadow: var(--shadow-3); padding-top: var(--sp-4);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-scrim {
    display: block; position: fixed; inset: 0; z-index: 140;
    background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .sidebar-scrim.open { opacity: 1; pointer-events: auto; }
}
@media (max-width: 560px) {
  .header-inner { padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); }
  .card-grid { grid-template-columns: 1fr; }
  .main { padding: var(--sp-4) var(--sp-3); }
  .page-title { font-size: 22px; }
}

/* utility */
.hidden { display: none !important; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════
   MODE SWITCH (header)
════════════════════════════════════════════════════ */
.mode-switch {
  display: inline-flex; gap: 2px; flex-shrink: 0;
  background: var(--md-surface-container); border-radius: var(--radius-full);
  padding: 3px;
}
.mode-switch button {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600; color: var(--md-on-surface-var);
  padding: 6px 12px; border-radius: var(--radius-full); transition: background .15s, color .15s;
  white-space: nowrap;
}
.mode-switch button .material-symbols-rounded { font-size: 18px; }
.mode-switch button.on { background: var(--md-surface); color: var(--md-primary); box-shadow: var(--shadow-1); }
@media (max-width: 760px){ .mode-switch .mode-label { display: none; } .mode-switch button { padding: 8px; } }

/* ═══════════════════════════════════════════════════
   LOGBOOK
════════════════════════════════════════════════════ */
.lb-head { display: flex; align-items: center; gap: 16px; margin-bottom: var(--sp-4); flex-wrap: wrap; }
.lb-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -.4px; }
.lb-count { font-size: 13px; color: var(--md-on-surface-var); }
.lb-mini-add {
  margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
  background: var(--md-primary); color: var(--md-on-primary); font-weight: 600; font-size: 14px;
  padding: 9px 16px; border-radius: var(--radius-full);
}
.lb-mini-add:hover { box-shadow: var(--shadow-2); filter: brightness(1.05); }

/* machine grid */
.lb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: var(--sp-4); }
.lb-mcard {
  background: var(--md-surface); border: 1px solid var(--md-outline-var); border-radius: var(--radius-lg);
  padding: var(--sp-5); text-align: left; cursor: pointer; transition: box-shadow .2s, transform .2s, border-color .2s;
  display: flex; flex-direction: column; gap: 2px;
}
.lb-mcard:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); border-color: transparent; }
.lb-platform { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--md-on-surface-var); }
.lb-mcard h3 { font-size: 18px; font-weight: 700; margin: 4px 0 2px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.lb-ip { font-family: var(--font-mono); font-size: 13px; color: var(--md-primary); }
.lb-os { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--md-on-surface-var); margin-top: 10px; }
.lb-attempt-mini { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); flex-wrap: wrap; }
.lb-pill { background: var(--md-surface-2); border: 1px solid var(--md-outline-var); border-radius: 4px; padding: 1px 6px; }
.lb-pill.done { color: var(--md-success); }
.lb-pill.cur { color: var(--md-warn); border-color: var(--md-warn); }
.lb-meta-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--md-outline-var); }
.lb-metric { font-family: var(--font-mono); font-size: 12px; color: var(--md-on-surface-var); }
.lb-metric b { color: var(--md-on-surface); font-weight: 700; }

.lb-status { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; letter-spacing: .3px; }
.lb-status.root { background: rgba(63,208,127,.15); color: var(--md-success); }
.lb-status.prog { background: rgba(224,169,68,.15); color: var(--md-warn); }
.lb-status.rep  { background: rgba(90,169,224,.15); color: var(--md-primary); }
.lb-status.todo { background: var(--md-surface-2); color: var(--md-on-surface-var); }
[data-theme="dark"] .lb-status.root { color: #3fd07f; }
[data-theme="dark"] .lb-status.prog { color: #e0a944; }
.lb-attempt-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: #2a8a86; background: rgba(69,200,176,.14); border: 1px solid rgba(69,200,176,.35); border-radius: 4px; padding: 2px 7px; }

/* filters */
.lb-phase-tabs, .lb-attempt-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lb-phase-tabs { margin-bottom: var(--sp-4); }
.lb-phase-tab {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--md-outline-var); background: var(--md-surface); color: var(--md-on-surface-var);
  display: inline-flex; align-items: center; gap: 6px;
}
.lb-phase-tab.on { background: var(--md-secondary-container); color: var(--md-on-surface); border-color: transparent; }
.lb-phase-tab .lb-count { font-size: 10px; color: var(--md-on-surface-var); }
.lb-phase-edit { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); border: 1px dashed var(--md-outline); border-radius: var(--radius-sm); padding: 6px 11px; display: inline-flex; align-items: center; gap: 5px; }
.lb-phase-edit:hover { background: var(--md-surface-2); }

/* machine detail */
.lb-machine { display: flex; gap: 0; }
.lb-machine-main { flex: 1; min-width: 0; }
.lb-m-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lb-m-title h1 { font-size: 26px; font-weight: 800; }
.lb-m-title .lb-ip { font-size: 15px; }
.lb-m-sub { font-size: 13px; color: var(--md-on-surface-var); margin: 4px 0 16px; }
.lb-m-edit { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); border: 1px solid var(--md-outline-var); border-radius: var(--radius-sm); padding: 4px 9px; }
.lb-m-edit:hover { background: var(--md-surface-2); }

.lb-attempt-tabs { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--md-outline-var); }
.lb-attempt-tab {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--md-outline-var);
  background: var(--md-surface); color: var(--md-on-surface-var);
}
.lb-attempt-tab.on { background: var(--md-secondary-container); color: var(--md-on-surface); border-color: transparent; }
.lb-attempt-tab.add { color: var(--md-primary); border-style: dashed; border-color: var(--md-primary); }
.lb-attempt-tab .st { font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.lb-attempt-tab .st.root { background: rgba(63,208,127,.15); color: var(--md-success); }
.lb-attempt-tab .st.prog { background: rgba(224,169,68,.15); color: var(--md-warn); }

/* quick input */
.lb-quick { display: flex; align-items: stretch; background: var(--md-surface-1); border: 1px solid var(--md-outline); border-radius: var(--radius); overflow: hidden; margin-bottom: 8px; }
.lb-phase-pick { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--md-warn); padding: 0 14px; height: 46px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--md-outline-var); background: var(--md-surface-2); white-space: nowrap; }
.lb-quick input { flex: 1; background: none; border: none; outline: none; color: var(--md-on-surface); font-family: var(--font-mono); font-size: 13px; padding: 0 14px; height: 46px; min-width: 0; }
.lb-quick input::placeholder { color: var(--md-on-surface-var); }
.lb-go { background: var(--md-primary); color: var(--md-on-primary); padding: 0 20px; font-weight: 700; font-family: var(--font-mono); font-size: 13px; }
.lb-quick-hint { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); margin-bottom: 20px; }
.lb-hint-mono { color: var(--md-on-surface); }

/* timeline */
.lb-timeline { position: relative; padding-left: 26px; }
.lb-timeline::before { content:""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--md-outline-var); }
.lb-entry { position: relative; margin-bottom: 20px; }
.lb-entry::before { content:""; position: absolute; left: -24px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--pc, #7d9186); border: 2px solid var(--md-surface); }
.lb-entry-head { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.lb-ph-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.lb-entry-time { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); margin-left: auto; }
.lb-step-edit, .lb-step-del { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); border: 1px solid var(--md-outline-var); border-radius: 4px; padding: 2px 7px; }
.lb-step-del:hover { color: var(--md-error); border-color: var(--md-error); }
.lb-cmd { font-family: var(--font-mono); font-size: 13px; background: var(--code-block-bg); color: var(--code-block-fg); border: 1px solid var(--md-outline-var); border-radius: var(--radius-sm); padding: 10px 14px; position: relative; overflow-x: auto; white-space: pre; }
.lb-prompt { color: #3fd07f; }
.lb-copy { position: absolute; right: 8px; top: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--md-on-surface-var); border: 1px solid var(--md-outline-var); border-radius: 4px; padding: 2px 6px; background: var(--md-surface); }
.lb-note { font-size: 13px; color: var(--md-on-surface-var); margin-top: 7px; }
.lb-learn { font-size: 12px; color: var(--md-warn); margin-top: 7px; padding: 8px 12px; background: rgba(224,169,68,.06); border-left: 2px solid var(--md-warn); border-radius: 0 6px 6px 0; }
.lb-learn b { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; opacity: .7; }
.lb-add-learn { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); margin-top: 7px; display: inline-flex; align-items: center; gap: 5px; }
.lb-add-learn:hover { color: var(--md-primary); }
.lb-empty-timeline { text-align: center; padding: 40px 20px; color: var(--md-on-surface-var); font-size: 14px; }

/* side panel */
.lb-side { width: 290px; flex-shrink: 0; border-left: 1px solid var(--md-outline-var); background: var(--md-surface); padding: 20px; margin-left: var(--sp-6); }
.lb-side-sec { margin-bottom: 24px; }
.lb-side-sec h4 { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--md-on-surface-var); margin-bottom: 11px; }
.lb-kv { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--md-outline-var); }
.lb-kv .k { color: var(--md-on-surface-var); }
.lb-kv .v { font-family: var(--font-mono); color: var(--md-on-surface); }
.lb-cred { font-family: var(--font-mono); font-size: 12px; background: var(--md-surface-1); border: 1px solid var(--md-outline-var); border-radius: 6px; padding: 8px 11px; margin-bottom: 7px; display: flex; align-items: center; gap: 8px; }
.lb-diff { color: var(--md-success); }
.lb-report-btn, .lb-status-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--md-surface-2); border: 1px solid var(--md-outline-var); color: var(--md-on-surface); font-weight: 600; font-size: 13px; padding: 11px; border-radius: var(--radius); margin-top: 8px; }
.lb-report-btn { border-color: var(--md-primary); color: var(--md-primary); }
.lb-report-btn:hover, .lb-status-btn:hover { box-shadow: var(--shadow-1); }
.lb-side-empty { color: var(--md-on-surface-var); font-size: 13px; }
.lb-arrow { color: var(--md-primary); }
.lb-flag { display: inline-flex; }

/* phase editor (modal body) */
.lb-phase-list { display: flex; flex-direction: column; gap: 8px; }
.lb-phase-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--md-outline-var); border-radius: var(--radius-sm); background: var(--md-surface-1); }
.lb-drag { color: var(--md-on-surface-var); font-family: var(--font-mono); }
.lb-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
.lb-phase-name { font-family: var(--font-mono); font-size: 13px; font-weight: 600; flex: 1; }
.lb-phase-count { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); }
.lb-phase-up, .lb-phase-down, .lb-phase-del { color: var(--md-on-surface-var); font-family: var(--font-mono); font-size: 11px; padding: 3px 7px; border: 1px solid var(--md-outline-var); border-radius: 4px; }
.lb-phase-del:hover { color: var(--md-error); border-color: var(--md-error); }
.lb-add-phase { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px dashed var(--md-primary); border-radius: var(--radius-sm); color: var(--md-primary); font-family: var(--font-mono); font-size: 12px; font-weight: 600; margin-top: 8px; width: 100%; justify-content: center; }
.lb-del-note { font-size: 12px; color: var(--md-on-surface-var); margin-top: 14px; padding: 10px 12px; background: var(--md-surface-1); border-radius: var(--radius-sm); line-height: 1.6; }

/* report */
.lb-report { display: flex; gap: 0; }
.lb-report-doc { flex: 1; min-width: 0; padding: 4px 8px; }
.lb-doc-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; border-bottom: 2px solid var(--md-primary); padding-bottom: 14px; }
.lb-doc-meta { font-family: var(--font-mono); font-size: 12px; color: var(--md-on-surface-var); margin: 14px 0 24px; display: flex; gap: 20px; flex-wrap: wrap; }
.lb-doc-h { font-size: 15px; font-weight: 700; color: var(--md-primary); font-family: var(--font-mono); margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--md-outline-var); }

/* ═══════════════════════════════════════════════════

════════════════════════════════════════════════════ */
.s-head { display: flex; align-items: center; gap: 16px; margin-bottom: var(--sp-4); flex-wrap: wrap; }

/* query grid */

.th-fp { font-size: 11px; color: var(--md-warn); display: flex; align-items: center; gap: 5px; }

.th-hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 16px; }
.th-hcard { background: var(--md-surface); border: 1px solid var(--md-outline-var); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; transition: box-shadow .15s, transform .15s, border-color .15s; display: flex; flex-direction: column; gap: 10px; }

.th-ds-chip { display: inline-block; font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); background: var(--md-surface-1); border: 1px solid var(--md-outline-var); border-radius: 5px; padding: 3px 8px; margin: 0 4px 4px 0; }

.th-side-empty { color: var(--md-on-surface-var); font-size: 13px; }

.th-dl { font-family: var(--font-mono); font-size: 11px; color: var(--md-on-surface-var); width: 110px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .3px; }

.th-report-side { width: 260px; flex-shrink: 0; border-left: 1px solid var(--md-outline-var); background: var(--md-surface); padding: 4px 20px; margin-left: var(--sp-6); }

.al-quick input{flex:1;background:var(--md-surface-container);border:1px solid var(--md-outline-var);border-radius:10px;padding:11px 14px;font-size:13px;outline:none;font-family:var(--font-mono);color:inherit}
.al-quick input:focus{border-color:var(--md-primary)}
.al-go{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:700;padding:0 18px;border-radius:10px;font-size:13px;border:none;cursor:pointer}
.al-quick-hint{font-size:11px;color:var(--md-on-surface-var);font-family:var(--font-mono);margin-bottom:18px;line-height:1.6}
.al-quick-hint b{color:var(--md-on-surface)}
.al-phase-edit{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:12px;color:var(--md-on-surface-var);border:1px dashed var(--md-outline-var);border-radius:8px;padding:5px 10px;background:none;cursor:pointer}
.al-phase-edit:hover{color:var(--md-on-surface);border-color:var(--md-outline)}

.al-steps{display:flex;flex-direction:column}
.al-step{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--md-outline-var)}
.al-step:first-child{border-top:none}
.al-step-side{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding-top:2px}
.al-phase-badge{font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px}
.al-step-idx{font-family:var(--font-mono);font-size:10px;color:var(--md-on-surface-var)}
.al-step-body{min-width:0}
.al-cmd{position:relative;background:var(--md-surface-dim);border:1px solid var(--md-outline-var);border-radius:9px;padding:10px 40px 10px 13px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.al-kw{color:var(--md-primary)}
.al-hl{color:var(--md-error);font-weight:600}
.al-comment{color:var(--md-on-surface-var)}
.al-copy{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--md-on-surface-var);background:none;border:none;cursor:pointer}
.al-copy:hover{background:var(--md-surface-container);color:var(--md-on-surface)}
.al-copy .material-symbols-rounded{font-size:15px}
.al-copy.inline{position:static;display:inline-grid;vertical-align:middle;margin-left:6px}
.al-output{margin-top:7px;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:var(--md-on-surface-var);background:var(--md-surface-container);border-radius:8px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}
.al-line{display:flex;gap:8px;margin-top:8px;font-size:12.5px;line-height:1.6}
.al-line .ic{font-size:16px;flex-shrink:0;margin-top:1px}
.al-line.aim .ic{color:var(--md-primary)}
.al-line.learn .ic{color:var(--md-warn)}
.al-step-acts{display:flex;gap:2px;margin-top:9px;align-items:center}
.al-to-drawer{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:7px;font-size:11px;font-family:var(--font-mono);color:var(--md-primary);background:none;border:none;cursor:pointer}
.al-to-drawer:hover{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.al-to-drawer .material-symbols-rounded{font-size:15px}

.al-flag{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;padding:7px 10px;border-radius:8px;background:var(--md-surface-dim);border:1px solid var(--md-outline-var);margin-bottom:6px}
.al-flag .lbl{color:var(--md-on-surface-var)}
.al-flag .val{margin-left:auto;color:var(--md-on-surface);word-break:break-all}
.al-flag.got{border-color:rgba(63,208,127,.4)}
.al-flag.got .val{color:#2a9d63}
.al-side-drawers{display:flex;flex-direction:column;gap:5px}
.al-side-drawer{display:flex;align-items:center;gap:6px;font-size:11.5px;background:var(--md-surface-dim);border:1px solid var(--md-outline-var);border-radius:7px;padding:5px 8px}
.al-side-drawer .sig{color:var(--md-on-surface);line-height:1.4}
.al-side-drawer-del{margin-left:auto;color:var(--md-on-surface-var);background:none;border:none;cursor:pointer;display:grid;place-items:center}
.al-side-drawer-del:hover{color:var(--md-error)}

/* 引き出し */
.al-drawer-hero{background:var(--md-surface-container);border:1px solid var(--md-outline-var);border-radius:14px;padding:14px 18px;margin-bottom:18px;font-size:13px;line-height:1.7;color:var(--md-on-surface-var)}
.al-drawer-hero b{color:var(--md-on-surface)}
.al-drawer-list{display:flex;flex-direction:column;gap:10px}
.al-drawer-card{background:var(--md-surface-container);border:1px solid var(--md-outline-var);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 24px 1.35fr;gap:14px;align-items:center}
.al-drawer-card:hover{border-color:var(--md-outline)}
.al-dc-signal{display:flex;gap:9px;align-items:flex-start}
.al-dc-signal .material-symbols-rounded{font-size:18px;color:var(--md-warn);margin-top:1px;flex-shrink:0}
.al-dc-signal span:last-child{font-size:13px;font-weight:600;line-height:1.5}
.al-dc-src{display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--md-on-surface-var);margin-top:6px;cursor:pointer}
.al-dc-src:hover{color:var(--md-primary)}
.al-dc-arrow{display:grid;place-items:center;color:var(--md-on-surface-var)}
.al-dc-action{font-family:var(--font-mono);font-size:12px;line-height:1.55;color:var(--md-on-surface);word-break:break-word}
.al-modal-note{font-size:11.5px;color:var(--md-on-surface-var);margin-top:10px;line-height:1.6;font-family:var(--font-mono)}

@media(max-width:840px){
  .al-td{grid-template-columns:1fr}
  .al-drawer-card{grid-template-columns:1fr;gap:8px}
  .al-dc-arrow{transform:rotate(90deg);justify-self:start}
  .al-step{grid-template-columns:1fr}.al-step-side{flex-direction:row;align-items:center}
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="app-header" id="appHeader">
  <div class="header-inner">
    <button class="icon-btn menu-toggle" id="menuToggle" title="メニュー" aria-label="メニュー">
      <span class="material-symbols-rounded">menu</span>
    </button>
    <div class="brand" id="brandHome" role="button" tabindex="0" title="ホームへ">
      <svg class="brand-mark" viewBox="0 0 120 108" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="go2grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4aa3ff"/>
            <stop offset="1" stop-color="#1a6dff"/>
          </linearGradient>
        </defs>
        <!-- 六角形の右側(青グラデ) -->
        <path d="M60 4 L104 29 L104 79 L60 104 L74 96 L74 33 Z" fill="url(#go2grad)"/>
        <!-- 六角形の左側(テーマ追従) -->
        <path d="M60 4 L46 12 L20 27 L20 81 L46 96 L60 104 L46 96 L34 79 L34 29 L46 12 Z" class="brand-mark-dark" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/>
        <!-- >_ ターミナル記号 -->
        <path d="M40 42 L54 54 L40 66" class="brand-mark-dark" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="50" y="62" width="20" height="8" rx="4" class="brand-mark-dark" fill="currentColor"/>
      </svg>
      <span class="brand-lockup">
        <span class="brand-text"><span class="brand-go2">go2</span> <span class="brand-cs">cheatsheet</span></span>
        <span class="brand-sub">COMMAND KNOWLEDGE · EXECUTE EXCELLENCE</span>
      </span>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span class="material-symbols-rounded lead-icon">search</span>
        <input id="searchInput" type="text" placeholder="コマンド・フィールド・コードを検索…" autocomplete="off" spellcheck="false" aria-label="検索">
        <button class="search-clear" id="searchClear" title="クリア" aria-label="クリア"><span class="material-symbols-rounded">close</span></button>
        <span class="kbd-hint" id="kbdHint"><span class="material-symbols-rounded" style="font-size:13px">keyboard_command_key</span>K</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="テーマ切替" aria-label="テーマ切替">
        <span class="material-symbols-rounded">dark_mode</span>
      </button>
      <button class="icon-btn edit-only-persist" id="editToggle" title="編集モード (E)" aria-label="編集モード">
        <span class="material-symbols-rounded">edit</span>
      </button>
      <button class="icon-btn" id="saveBtn" title="GitHubに保存" aria-label="保存">
        <span class="material-symbols-rounded">cloud_upload</span>
      </button>
      <div style="position:relative">
        <button class="icon-btn" id="moreBtn" title="その他" aria-label="その他" onclick="toggleExportMenu(event)">
          <span class="material-symbols-rounded">more_vert</span>
        </button>
        <div class="blk-menu" id="exportMenu" style="right:0;top:48px">
          <button onclick="exportJSON()"><span class="material-symbols-rounded">data_object</span>JSONをエクスポート</button>
          <button onclick="exportHTML()"><span class="material-symbols-rounded">html</span>HTMLを書き出し</button>
        </div>
      </div>
    </div>
  </div>
  <div class="mode-row">
    <div class="mode-switch" id="modeSwitch">
      <button data-mode="cheatsheet" class="on" title="チートシート"><span class="material-symbols-rounded">grid_view</span><span class="mode-label">チートシート</span></button>
      <button data-mode="tools" title="ツール・リファレンス"><span class="material-symbols-rounded">build</span><span class="mode-label">ツール</span></button>
      <button data-mode="knowledge" title="ナレッジ・リンク集"><span class="material-symbols-rounded">menu_book</span><span class="mode-label">ナレッジ</span></button>
      <button data-mode="methodology" title="攻略メソドロジー"><span class="material-symbols-rounded">account_tree</span><span class="mode-label">メソドロジー</span></button>
      <button data-mode="commands" title="便利コマンド集"><span class="material-symbols-rounded">terminal</span><span class="mode-label">コマンド</span></button>
      <span class="mode-group-sep" title="攻撃"></span>
      <button data-mode="attacklog" title="攻略ログ (OSCP / OSWA)"><span class="material-symbols-rounded">track_changes</span><span class="mode-label">攻略ログ</span></button>
      <button data-mode="payload" title="ペイロード集"><span class="material-symbols-rounded">vaccines</span><span class="mode-label">ペイロード</span></button>
      <span class="mode-group-sep" title="防御"></span>
      <button data-mode="hunt" title="ハント"><span class="material-symbols-rounded">travel_explore</span><span class="mode-label">ハント</span></button>
      <button data-mode="query" title="検知クエリ集"><span class="material-symbols-rounded">manage_search</span><span class="mode-label">クエリ集</span></button>
      <button data-mode="coverage" title="ATT&CKカバレッジ"><span class="material-symbols-rounded">map</span><span class="mode-label">カバレッジ</span></button>
      <button data-mode="dashboards" title="ダッシュボード保管"><span class="material-symbols-rounded">dashboard</span><span class="mode-label">ダッシュボード</span></button>
    </div>
  </div>
</header>

<!-- ═══ LAYOUT ═══ -->
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-section-label">カテゴリ</div>
    <nav id="navList"></nav>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <main class="main" id="main"></main>
</div>

<!-- ═══ MODAL ═══ -->
<div class="modal-scrim" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-text" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-filled" onclick="confirmModal()">OK</button>
    </div>
  </div>
</div>

<!-- hidden file input for import -->
<input type="file" id="importFile" accept="application/json" class="hidden">

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="attacklog.js"></script>
<script src="hunting.js"></script>
<script src="tools.js"></script>
<script src="knowledge_data.js"></script>
<script src="knowledge.js"></script>
<script src="dashboards.js"></script>
<script src="methodology.js"></script>
<script src="commands.js"></script>
</body>
</html>
